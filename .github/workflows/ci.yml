name: Vaqueros Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and Docker Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      # -------------------------
      # SECURITY - SNYK
      # -------------------------

      - name: Install Snyk
        run: npm install -g snyk

      - name: Snyk dependency scan
        run: snyk test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk code scan
        run: snyk code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -------------------------
      # DOCKER
      # -------------------------

      - name: Build Docker image
        run: docker build -t vaqueros-backend:${{ github.sha }} .
