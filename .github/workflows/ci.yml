name: Vaqueros Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and Docker Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      # -------------------------
      # SECURITY - SNYK
      # -------------------------

      - name: Snyk dependency scan
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test
          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Snyk found dependency vulnerabilities, continuing pipeline."
            exit 0
          fi

          exit "$EXIT_CODE"

      - name: Snyk code scan
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test
          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Snyk found code vulnerabilities, continuing pipeline."
            exit 0
          fi

          exit "$EXIT_CODE"

      # -------------------------
      # DOCKER
      # -------------------------

      - name: Build Docker image
        run: docker build -t vaqueros-backend:${{ github.sha }} .
